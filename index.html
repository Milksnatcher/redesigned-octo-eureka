<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compra Conjunta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F4; --panel:#FFFFFF; --ink:#1F2A22; --sub:#5B6B60;
  --line:#E4E0D4; --brand:#2F6F4E; --brand-ink:#EAF3EC;
  --amber:#B5761A; --amber-bg:#FBF0DF; --owe:#A24B3B; --owe-bg:#FBEAE5;
  --paid:#2F6F4E; --paid-bg:#E7F1EA; --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#171B18; --panel:#1F2521; --ink:#EDEFEA; --sub:#9AA79E;
    --line:#2C332D; --brand:#63B98A; --brand-ink:#12241A;
    --amber:#E3A94E; --amber-bg:#2E2617; --owe:#E0806D; --owe-bg:#301C18;
    --paid:#63B98A; --paid-bg:#16281F;
  }
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.42;}
h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif;}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 96px;}
header.top{position:sticky;top:0;background:var(--bg);z-index:10;padding:14px 16px 8px;border-bottom:1px solid var(--line);}
header.top .wrap{padding:0;display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.brand{font-size:18px;font-weight:700;letter-spacing:-0.01em;}
.brand span{color:var(--brand);}
.status{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
.status.ok{background:var(--paid-bg);color:var(--paid);}
.status.bad{background:var(--owe-bg);color:var(--owe);}
nav.tabs{display:flex;gap:6px;margin-top:10px;}
nav.tabs button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--sub);padding:9px 11px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
nav.tabs button.active{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);}
.burger-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);width:34px;height:34px;border-radius:9px;font-size:16px;cursor:pointer;flex:0 0 auto;}
.menu-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none;}
.menu-backdrop.open{display:block;}
.menu-panel{position:absolute;top:0;right:0;background:var(--panel);border-left:1px solid var(--line);width:78vw;max-width:280px;height:100%;padding:18px 14px;box-shadow:-4px 0 16px rgba(0,0,0,.15);}
.menu-panel h3{margin:0 0 12px;font-size:15px;}
.menu-panel button{display:block;width:100%;text-align:left;background:none;border:none;padding:12px 8px;font-size:14.5px;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--line);}
.menu-panel button:last-child{border-bottom:none;}
.fab{position:fixed;bottom:24px;right:20px;width:54px;height:54px;border-radius:50%;background:var(--brand);color:var(--brand-ink);border:none;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:15;line-height:1;text-align:center;padding:0;}
.page-title{font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px;}
.page-sub{font-size:12.5px;color:var(--sub);margin-bottom:12px;}
.hint-link{background:none;border:none;color:var(--brand);font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0;margin-top:4px;}
main{padding-top:12px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;}
.card h2{margin:0 0 2px;font-size:15.5px;}
.muted{color:var(--sub);font-size:12.5px;}
.empty{text-align:center;padding:32px 20px;color:var(--sub);}
.empty h3{color:var(--ink);margin-bottom:6px;}
label{display:block;font-size:12px;color:var(--sub);margin:8px 0 3px;font-weight:600;}
input[type=text],input[type=tel],input[type=number],input[type=date],select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px;}
input:disabled{opacity:.5;}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:1px;}
.row{display:flex;gap:8px;}
.row>*{flex:1;}
button.primary{background:var(--brand);color:var(--brand-ink);border:none;padding:10px 16px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;width:100%;margin-top:10px;}
button.ghost{background:transparent;border:1px dashed var(--line);color:var(--sub);padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer;width:100%;}
.chip{display:inline-block;background:var(--brand-ink);color:var(--brand);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;}
.prod-row{display:grid;grid-template-columns:1fr 84px 26px;gap:6px;align-items:center;margin-bottom:5px;}
.x{border:none;background:none;color:var(--sub);font-size:18px;cursor:pointer;line-height:1;}
table.matrix{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
table.matrix th,table.matrix td{padding:5px 4px;text-align:center;border-bottom:1px solid var(--line);}
table.matrix th{color:var(--sub);font-weight:600;font-size:11px;}
table.matrix td:first-child,table.matrix th:first-child{text-align:left;}
table.matrix input{width:50px;padding:4px;text-align:center;font-size:13px;}
.mtable-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.totals{margin-top:8px;border-top:1px solid var(--line);padding-top:6px;}
.totals .line{display:flex;justify-content:space-between;padding:2px 0;font-size:13px;}
.totals .line b{font-family:'Space Grotesk',sans-serif;}
.name-paid{color:var(--paid);text-decoration:line-through;}
.name-owe{color:var(--owe);}
.agg-box{display:flex;gap:14px;margin:8px 0;font-size:12.5px;}
.agg-box b{font-family:'Space Grotesk',sans-serif;font-size:14px;}
.order-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px;}
.order-head .left{display:flex;align-items:center;gap:8px;min-width:0;}
.order-head .titles{min-width:0;}
.order-head .titles h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.order-head .titles p{margin:0;}
.chev{transition:transform .2s;color:var(--sub);flex:0 0 auto;font-size:13px;}
.chev.open{transform:rotate(180deg);}
.done-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--paid);background:var(--paid-bg);padding:2px 9px;border-radius:20px;flex:0 0 auto;}
.done-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--paid);}
.lock-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--owe);background:var(--owe-bg);padding:2px 9px;border-radius:20px;flex:0 0 auto;}
.order-body{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;}
.note{font-size:11.5px;color:var(--sub);margin-top:4px;}
.debt{padding:10px 0;border-bottom:1px solid var(--line);}
.debt:last-child{border-bottom:none;}
.debt-head{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;}
.debt .who{font-size:13.5px;}
.debt .amt{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;}
.debt.paid .amt{color:var(--paid);}
.debt.pend .amt{color:var(--owe);}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.btn-sm{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--ink);}
.btn-bizum{background:var(--amber-bg);color:var(--amber);border-color:transparent;}
.btn-paid{background:var(--paid-bg);color:var(--paid);border-color:transparent;}
.status-pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;}
.status-pill.pend{background:var(--owe-bg);color:var(--owe);}
.status-pill.paid{background:var(--paid-bg);color:var(--paid);}
.mark-form{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:8px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:30px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;max-width:90vw;}
.toast.show{opacity:1;}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
#login-screen .card{max-width:340px;width:100%;}
#login-screen .brand{text-align:center;margin-bottom:4px;font-size:21px;}
#login-screen p.muted{text-align:center;margin-bottom:4px;}
#login-error{color:var(--owe);font-size:13px;margin-top:8px;min-height:16px;}
.btn-logout{background:none;border:none;color:var(--sub);font-size:12px;cursor:pointer;text-decoration:underline;padding:0;}
.user-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:10px;}
.user-row:last-child{border-bottom:none;}
.user-row .info b{display:block;font-size:14px;}
.user-row .info span{font-size:12px;color:var(--sub);}
.section-title{font-size:12.5px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;margin:16px 0 6px;}
.export-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.export-row select{width:auto;flex:1;min-width:120px;font-size:12px;padding:6px 8px;}
.sub-order{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-top:8px;}
.sub-order-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px;}
.sub-items{font-size:12.5px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);}
.sub-items .l{display:flex;justify-content:space-between;padding:2px 0;}
</style>
</head>
<body>
<div id="login-screen" style="display:none">
  <div class="card">
    <h2 class="brand">Compra <span>Conjunta</span></h2>
    <p class="muted">Accede con el usuario compartido del grupo.</p>
    <label>Correo</label>
    <input type="text" id="login-email" autocomplete="username">
    <label>Contraseña</label>
    <input type="text" id="login-password" autocomplete="current-password">
    <div id="login-error"></div>
    <button class="primary" id="login-btn" type="button">Entrar</button>
  </div>
</div>

<div id="app-root" style="display:none">
<header class="top"><div class="wrap">
  <div class="brand">Compra <span>Conjunta</span></div>
  <div style="display:flex;align-items:center;gap:8px">
    <span class="status" id="conn-status">Conectando…</span>
    <button class="burger-btn" id="btn-menu" type="button">☰</button>
  </div>
</div>
<div class="wrap"><nav class="tabs">
  <button id="tab-pedidos" class="active">Actuales</button>
  <button id="tab-balances">Balances</button>
</nav></div>
</header>
<div class="wrap"><main id="main"></main></div>
<button class="fab" id="fab-nuevo" type="button" style="display:none" title="Nuevo pedido">+</button>
<div class="menu-backdrop" id="menu-backdrop">
  <div class="menu-panel">
    <h3>Menú</h3>
    <button id="menu-nuevo" type="button">➕ Nuevo pedido</button>
    <button id="menu-completados" type="button">📦 Pedidos completados (historial)</button>
    <button id="menu-usuarios" type="button">👥 Usuarios del grupo</button>
    <button id="menu-logout" type="button">Cerrar sesión</button>
  </div>
</div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';

let supabase = null;
let state = { orders: [], orderPayments: {}, users: [] };
let view = "pedidos";
let openOrderIds = new Set();
let openNetKeys = new Set();
let openSubOrders = new Set();
let historyPageSize = 5;
const TEN_DAYS = 10*24*60*60*1000;

const toast = (msg) => { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); };
const setStatus = (ok,msg) => { const el=document.getElementById('conn-status'); el.textContent=msg; el.className='status '+(ok?'ok':'bad'); };
const fmt = (n) => (Math.round(n*100)/100).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const fmtDate = (ms) => ms ? new Date(ms).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}) : '';
const uid = () => Math.random().toString(36).slice(2,10);
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function userById(id){ return state.users.find(u=>u.id===id); }
function userName(id){ const u=userById(id); return u ? u.name : '—'; }
function dateInputToMs(val){ return val ? new Date(val+'T12:00:00').getTime() : null; }
function msToDateInput(ms){ return ms ? new Date(ms).toISOString().slice(0,10) : ''; }

// ---------- auth ----------
async function initAuth(){
  if(SUPABASE_URL.startsWith('YOUR_') || SUPABASE_ANON_KEY.startsWith('YOUR_')){
    document.getElementById('login-screen').style.display='flex';
    document.getElementById('login-error').textContent = 'Falta configurar config.js con tu proyecto de Supabase.';
    return;
  }
  supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data: { session } } = await supabase.auth.getSession();
  if(session){ showApp(); } else { document.getElementById('login-screen').style.display='flex'; }
  supabase.auth.onAuthStateChange((event)=>{
    if(event === 'SIGNED_IN') showApp();
    if(event === 'SIGNED_OUT'){ document.getElementById('app-root').style.display='none'; document.getElementById('login-screen').style.display='flex'; }
  });
}
document.getElementById('login-btn').onclick = async ()=>{
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Introduce correo y contraseña.'; return; }
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if(error){ errEl.textContent = 'Acceso incorrecto. Revisa el correo y la contraseña.'; }
};
function closeMenu(){ document.getElementById('menu-backdrop').classList.remove('open'); }
document.getElementById('btn-menu').onclick = ()=> document.getElementById('menu-backdrop').classList.add('open');
document.getElementById('menu-backdrop').addEventListener('click', (e)=>{ if(e.target.id==='menu-backdrop') closeMenu(); });
document.getElementById('menu-logout').onclick = ()=>{ closeMenu(); supabase.auth.signOut(); };

async function showApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-root').style.display='block';
  await loadAll();
  supabase.channel('sync-orders').on('postgres_changes', {event:'*', schema:'public', table:'orders'}, loadAll).subscribe();
  supabase.channel('sync-op').on('postgres_changes', {event:'*', schema:'public', table:'order_payments'}, loadAll).subscribe();
  supabase.channel('sync-users').on('postgres_changes', {event:'*', schema:'public', table:'users'}, loadAll).subscribe();
  setStatus(true, 'Sincronizado');
}

// ---------- persistence ----------
function rowToOrder(r){
  return { id:r.id, supplier:r.supplier, ownerId:r.owner_id, transport:r.transport,
    products:r.products||[], people:r.people||[], qty:r.qty||{}, createdAt:r.created_at,
    orderByDate:r.order_by_date, manualCompletedAt:r.manual_completed_at };
}
function orderToRow(o){
  return { id:o.id, supplier:o.supplier, owner_id:o.ownerId, transport:o.transport,
    products:o.products, people:o.people, qty:o.qty, created_at:o.createdAt,
    order_by_date:o.orderByDate||null, manual_completed_at:o.manualCompletedAt||null };
}
async function loadAll(){
  const [{data:orderRows,error:e1}, {data:opRows,error:e2}, {data:userRows,error:e3}] = await Promise.all([
    supabase.from('orders').select('*').order('created_at',{ascending:false}),
    supabase.from('order_payments').select('*'),
    supabase.from('users').select('*').order('name',{ascending:true}),
  ]);
  if(e1||e2||e3){ setStatus(false,'Error de conexión'); return; }
  state.orders = (orderRows||[]).map(rowToOrder);
  state.orderPayments = {};
  (opRows||[]).forEach(p=>{ state.orderPayments[p.order_id+'::'+p.person_id] = {paid:!!p.paid, amount:p.amount, markedBy:p.marked_by, markedDate:p.marked_date}; });
  state.users = userRows||[];
  setStatus(true,'Sincronizado');
  render();
}
async function saveOrder(order){ if(!supabase) return; const {error}=await supabase.from('orders').upsert(orderToRow(order)); if(error) toast('Error: '+error.message); }
async function deleteOrder(id){ if(!supabase) return; const {error}=await supabase.from('orders').delete().eq('id',id); if(error) toast('Error: '+error.message); }
async function saveUser(u){ if(!supabase) return; const {error}=await supabase.from('users').upsert(u); if(error) toast('Error: '+error.message); }
async function deleteUser(id){ if(!supabase) return; const {error}=await supabase.from('users').delete().eq('id',id); if(error) toast('Error: '+error.message); }
async function saveOrderPayment(orderId, personId, fields){
  if(!supabase) return;
  const {error} = await supabase.from('order_payments').upsert({ order_id:orderId, person_id:personId, ...fields });
  if(error) toast('Error: '+error.message);
}
function getOP(orderId, personId){ return state.orderPayments[orderId+'::'+personId] || {paid:false}; }

// ---------- calculation ----------
function computeOrderTotals(order){
  const people = order.people||[], products = order.products||[], qty = order.qty||{};
  const perPerson = {}; let orderSubtotal = 0;
  people.forEach(p=>{
    let sub=0; products.forEach(prod=> sub += (Number((qty[p]||{})[prod.id])||0)*prod.price);
    perPerson[p] = {subtotal:sub}; orderSubtotal += sub;
  });
  const transport = Number(order.transport)||0;
  people.forEach(p=>{
    const share = orderSubtotal>0 ? (perPerson[p].subtotal/orderSubtotal)*transport : 0;
    perPerson[p].transport = share; perPerson[p].total = perPerson[p].subtotal + share;
  });
  return { perPerson, orderSubtotal, transport };
}
function orderPendingPeople(order){
  const {perPerson} = computeOrderTotals(order);
  return (order.people||[]).filter(p=>p!==order.ownerId && perPerson[p].total>0.004 && !getOP(order.id,p).paid)
    .map(p=>({person:p, amount:perPerson[p].total}));
}
function orderCollected(order){
  const {perPerson} = computeOrderTotals(order);
  let collected=0, outstanding=0;
  (order.people||[]).forEach(p=>{
    if(p===order.ownerId) return;
    const amt = perPerson[p].total;
    if(getOP(order.id,p).paid) collected += amt; else outstanding += amt;
  });
  return {collected, outstanding};
}
function isAutoSettled(order){ return orderPendingPeople(order).length===0; }
function isLocked(order){ return !!order.orderByDate && Date.now() > order.orderByDate; }
function isCompleted(order){ return !!order.manualCompletedAt || isAutoSettled(order); }
function effectiveCompletedAt(order){
  if(order.manualCompletedAt) return order.manualCompletedAt;
  if(!isAutoSettled(order)) return null;
  const dates = (order.people||[]).filter(p=>p!==order.ownerId).map(p=>getOP(order.id,p).markedDate).filter(Boolean);
  return dates.length ? Math.max(...dates) : order.createdAt;
}

// pair ledger: from all orders, build per-order-per-person transactions, then net per pair
function buildTransactions(){
  const txs = [];
  state.orders.forEach(order=>{
    const {perPerson} = computeOrderTotals(order);
    (order.people||[]).forEach(p=>{
      if(p===order.ownerId) return;
      const amount = perPerson[p].total;
      if(amount<=0.004 && !getOP(order.id,p).paid) return;
      const op = getOP(order.id,p);
      txs.push({ orderId:order.id, from:p, to:order.ownerId, amount: op.paid && op.amount!=null ? op.amount : amount,
        paid:op.paid, markedBy:op.markedBy, markedDate:op.markedDate });
    });
  });
  return txs;
}
function pairKey(a,b){ return [a,b].sort().join('||'); }
function computeNetPairs(){
  const txs = buildTransactions();
  const groups = {};
  txs.forEach(tx=>{ const k=pairKey(tx.from,tx.to); groups[k]=groups[k]||[]; groups[k].push(tx); });
  const pairs = [];
  Object.keys(groups).forEach(k=>{
    const list = groups[k];
    const [x,y] = k.split('||');
    let unpaidXY=0, unpaidYX=0;
    list.forEach(tx=>{ if(tx.paid) return; if(tx.from===x) unpaidXY+=tx.amount; else unpaidYX+=tx.amount; });
    const diff = unpaidXY - unpaidYX;
    const settled = Math.abs(diff) < 0.005;
    const from = diff>=0 ? x : y, to = diff>=0 ? y : x;
    const amount = Math.abs(diff);
    const isOverdue = list.some(tx=>{ const o=state.orders.find(o=>o.id===tx.orderId); return o && o.orderByDate && Date.now()>o.orderByDate; });
    const paidDates = list.filter(tx=>tx.paid && tx.markedDate).map(tx=>tx.markedDate);
    const allPaidOrNone = list.every(tx=>tx.paid);
    const settledAt = (settled && allPaidOrNone && paidDates.length) ? Math.max(...paidDates) : null;
    pairs.push({ key:from+'::'+to, from, to, amount, settled, isOverdue, settledAt, txs:list });
  });
  return pairs.filter(p=> p.amount>0.004 || p.settled);
}

// ---------- render shell ----------
function render(){
  document.getElementById('tab-pedidos').classList.toggle('active', view==='pedidos');
  document.getElementById('tab-balances').classList.toggle('active', view==='balances');
  document.getElementById('fab-nuevo').style.display = (view==='balances') ? 'block' : 'none';
  const main = document.getElementById('main'); main.innerHTML = '';
  if(view==='pedidos') main.appendChild(renderPedidos(false));
  if(view==='nuevo') main.appendChild(renderNuevo());
  if(view==='balances') main.appendChild(renderBalances());
  if(view==='completados') main.appendChild(renderPedidos(true));
  if(view==='usuarios') main.appendChild(renderUsuarios());
}

// ---------- Pedidos ----------
function splitOrders(){
  const now = Date.now(); const active=[], archived=[];
  state.orders.forEach(o=>{
    const done = isCompleted(o); const cAt = effectiveCompletedAt(o);
    const old = done && cAt && (now-cAt >= TEN_DAYS);
    (old ? archived : active).push(o);
  });
  return {active, archived};
}
function renderPedidos(archivedMode){
  const {active, archived} = splitOrders();
  const list = archivedMode ? archived : active;
  const wrap = document.createElement('div');
  wrap.appendChild(el(archivedMode
    ? `<div><div class="page-title">Pedidos completados</div><p class="page-sub">Historial de pedidos ya cerrados hace más de 10 días. Siguen disponibles para copiar al crear uno nuevo.</p></div>`
    : `<div><div class="page-title">Pedidos actuales</div><p class="page-sub">En curso — todavía no completados.</p></div>`));
  if(!list.length){
    wrap.appendChild(el(`<div class="card empty"><h3>${archivedMode?'Todavía no hay pedidos completados':'Todavía no hay pedidos'}</h3><p class="muted">${archivedMode?'Los pedidos completados hace más de 10 días aparecerán aquí.':'Crea el primer pedido con el botón + de Balances o desde el menú ☰.'}</p></div>`));
    return wrap;
  }
  list.forEach(order=> wrap.appendChild(renderOrderCard(order, archivedMode)));
  return wrap;
}
function renderOrderCard(order, archivedMode){
  const isOpen = openOrderIds.has(order.id);
  const done = isCompleted(order);
  const locked = isLocked(order);
  const card = el(`<div class="card order-card">
    <div class="order-head" data-toggle>
      <div class="left">
        <span class="chev ${isOpen?'open':''}">▾</span>
        <div class="titles">
          <h2>${escapeHtml(order.supplier||'Proveedor')}</h2>
          <p class="muted">Organiza ${escapeHtml(userName(order.ownerId))}${order.orderByDate?' · límite '+fmtDate(order.orderByDate):''}</p>
        </div>
      </div>
      ${done ? `<span class="done-pill"><span class="dot"></span>Completo</span>` : (locked ? `<span class="lock-pill">Bloqueado</span>` : '')}
    </div>
    <div class="order-body" data-body style="display:${isOpen?'block':'none'}"></div>
  </div>`);
  card.querySelector('[data-toggle]').onclick = ()=>{ openOrderIds.has(order.id)?openOrderIds.delete(order.id):openOrderIds.add(order.id); render(); };
  if(isOpen) fillOrderBody(card.querySelector('[data-body]'), order);
  return card;
}
function fillOrderBody(body, order){
  const {perPerson, orderSubtotal, transport} = computeOrderTotals(order);
  const locked = isLocked(order);
  body.appendChild(renderMatrix(order, locked));
  if(!locked){
    const addRow = el(`<div class="row" style="margin-top:8px;gap:6px">
      <select data-add-person style="flex:1"></select>
      <button class="btn-sm" data-add-person-btn type="button" style="width:auto">Añadir</button>
    </div>`);
    const sel = addRow.querySelector('[data-add-person]');
    const already = new Set(order.people||[]);
    sel.innerHTML = `<option value="">Añadir persona…</option>` + state.users.filter(u=>!already.has(u.id)).map(u=>`<option value="${u.id}">${escapeHtml(u.name)}</option>`).join('');
    addRow.querySelector('[data-add-person-btn]').onclick = ()=>{ if(!sel.value) return; saveOrder({...order, people:[...(order.people||[]), sel.value]}); };
    body.appendChild(addRow);
    const hint = el(`<button class="hint-link" type="button">¿No aparece quien buscas? Añádelo en Usuarios →</button>`);
    hint.onclick = ()=>{ editingUser=null; view='usuarios'; render(); };
    body.appendChild(hint);
  } else {
    body.appendChild(el(`<p class="note">Bloqueado desde el ${fmtDate(order.orderByDate)}. Edita el pedido y amplía la fecha límite para volver a modificarlo.</p>`));
  }

  const {collected, outstanding} = orderCollected(order);
  body.appendChild(el(`<div class="agg-box"><span class="muted">Recaudado <b style="color:var(--paid)">${fmt(collected)}</b></span><span class="muted">Pendiente <b style="color:var(--owe)">${fmt(outstanding)}</b></span></div>`));

  const totalsEl = el('<div class="totals"></div>');
  (order.people||[]).forEach(p=>{
    const isOwner = p===order.ownerId;
    let cls = '';
    if(locked && !isOwner) cls = getOP(order.id,p).paid ? 'name-paid' : 'name-owe';
    totalsEl.appendChild(el(`<div class="line"><span class="${cls}">${escapeHtml(userName(p))}${isOwner?' <span class="muted">(cobra)</span>':''}</span><b>${fmt(perPerson[p].total)}</b></div>`));
  });
  totalsEl.appendChild(el(`<div class="line muted"><span>Subtotal productos</span><span>${fmt(orderSubtotal)}</span></div>`));
  totalsEl.appendChild(el(`<div class="line muted"><span>Transporte</span><span>${fmt(transport)}</span></div>`));
  body.appendChild(totalsEl);

  const exp = el(`<div class="export-row">
    <select data-orient><option value="rows">Productos en filas</option><option value="cols">Productos en columnas</option></select>
    <button class="btn-sm" data-exp-csv type="button">CSV</button>
    <button class="btn-sm" data-exp-xlsx type="button">Excel</button>
  </div>`);
  exp.querySelector('[data-exp-csv]').onclick = ()=> exportOrder(order, exp.querySelector('[data-orient]').value, 'csv');
  exp.querySelector('[data-exp-xlsx]').onclick = ()=> exportOrder(order, exp.querySelector('[data-orient]').value, 'xlsx');
  body.appendChild(exp);

  const actions = el(`<div class="actions" style="margin-top:12px;justify-content:flex-start;flex-direction:column;align-items:flex-start;gap:8px">
    <div class="actions" style="justify-content:flex-start">
      <button class="btn-sm" data-edit type="button">Editar</button>
      <button class="btn-sm" data-del type="button">Eliminar</button>
      ${!order.manualCompletedAt ? `<button class="btn-sm btn-paid" data-complete type="button">Marcar completado</button>` : `<button class="btn-sm" data-reopen type="button">Reabrir pedido</button>`}
    </div>
    ${!order.manualCompletedAt ? `<p class="note">Se completa solo cuando todas las deudas de este pedido estén pagadas. El botón de arriba es un cierre manual que da el pedido por completado aunque queden deudas sin cobrar.</p>` : ''}
  </div>`);
  actions.querySelector('[data-del]').onclick = ()=>{ if(confirm('¿Eliminar este pedido?')) deleteOrder(order.id); };
  actions.querySelector('[data-edit]').onclick = ()=> openEditOrder(order);
  const completeBtn = actions.querySelector('[data-complete]');
  if(completeBtn) completeBtn.onclick = ()=>{
    const pending = orderPendingPeople(order);
    if(pending.length){
      const detail = pending.map(p=>`${userName(p.person)}: ${fmt(p.amount)}`).join(', ');
      if(!confirm('Quedan saldos sin cobrar en este pedido ('+detail+'). ¿Marcar igualmente como completado? (esto no salda las deudas, solo cierra el pedido)')) return;
    }
    saveOrder({...order, manualCompletedAt: Date.now()});
  };
  const reopenBtn = actions.querySelector('[data-reopen]');
  if(reopenBtn) reopenBtn.onclick = ()=> saveOrder({...order, manualCompletedAt:null});
  body.appendChild(actions);
}
function renderMatrix(order, locked){
  const products = order.products||[], people = order.people||[], qty = order.qty||{};
  const t = document.createElement('table'); t.className='matrix';
  t.innerHTML = '<tr><th>Persona</th>' + products.map(p=>`<th>${escapeHtml(p.name)}<br><span style="font-weight:400">${fmt(p.price)}</span></th>`).join('') + '</tr>';
  people.forEach(person=>{
    const tr = document.createElement('tr');
    let cells = `<td>${escapeHtml(userName(person))}</td>`;
    products.forEach(prod=>{
      const val = (qty[person]||{})[prod.id] || '';
      cells += `<td><input type="number" min="0" step="1" value="${val}" ${locked?'disabled':''} data-qty-order="${order.id}" data-qty-person="${person}" data-qty-prod="${prod.id}"></td>`;
    });
    tr.innerHTML = cells; t.appendChild(tr);
  });
  t.querySelectorAll('input[data-qty-order]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const oid=inp.dataset.qtyOrder, person=inp.dataset.qtyPerson, pid=inp.dataset.qtyProd;
      const cur = state.orders.find(o=>o.id===oid); if(!cur) return;
      const nextQty = JSON.parse(JSON.stringify(cur.qty||{}));
      nextQty[person]=nextQty[person]||{}; nextQty[person][pid]=Number(inp.value)||0;
      saveOrder({...cur, qty: nextQty});
    });
  });
  return t;
}

      <button class="btn-sm" id="f-paste-import" type="button" style="margin-top:6px">Importar de la lista pegada</button>
      <div style="border-top:1px solid var(--line);margin:12px 0 10px"></div>

    </div>

    <div id="f-products"></div>

        const priceNum = parseFloat(parts[1].replace(',', '.').replace(/[^0-9.]/g,''));
        return { name: parts[0].trim(), price: isNaN(priceNum) ? '' : priceNum };

  wrap.querySelector('#f-file').addEventListener('change', (ev)=>{

      try{
        const wb = XLSX.read(e.target.result, {type:'array'});

    };
    reader.readAsArrayBuffer(file);
  });

    const previewEl = wrap.querySelector('#f-file-preview');

    const numCols = Math.max(...aoa.map(r=>r.length));

    previewEl.innerHTML = `

      ${tableHtml}
      <div class="row" style="margin-top:8px">
        <div><label>Columna del nombre</label><select id="f-col-name">${Array.from({length:numCols},(_,i)=>`<option value="${i}">${colLabel(i)}</option>`).join('')}</select></div>
        <div><label>Columna del precio (opcional)</label><select id="f-col-price"><option value="">Ninguna</option>${Array.from({length:numCols},(_,i)=>`<option value="${i}">${colLabel(i)}</option>`).join('')}</select></div>

      <input type="number" id="f-start-row" min="1" value="1" style="max-width:100px">

    `;
    previewEl.querySelector('#f-file-import').onclick = ()=>{

      const priceColRaw = previewEl.querySelector('#f-col-price').value;

    }

  return wrap;

// ---------- Balances ----------
function renderBalances(){
  const pairs = computeNetPairs();
  const now = Date.now();
  const open = pairs.filter(p=>!p.settled);
  const recentSettled = pairs.filter(p=>p.settled && p.settledAt && now-p.settledAt < TEN_DAYS);
  const oldSettled = pairs.filter(p=>p.settled && p.settledAt && now-p.settledAt >= TEN_DAYS).sort((a,b)=>b.settledAt-a.settledAt);
  const required = [...open.filter(p=>p.isOverdue), ...recentSettled.filter(p=>p.isOverdue)];
  const notDue = [...open.filter(p=>!p.isOverdue), ...recentSettled.filter(p=>!p.isOverdue)];
  const wrap = document.createElement('div');
  if(!required.length && !notDue.length && !oldSettled.length){
    wrap.appendChild(el(`<div class="card empty"><h3>Nada pendiente</h3><p class="muted">En cuanto haya pedidos con cantidades, aquí aparecerán las deudas netas entre personas.</p></div>`));
    return wrap;
  }
  wrap.appendChild(el(`<div class="section-title">Pagos requeridos — pedidos ya pasados de fecha límite</div>`));
  wrap.appendChild(sectionCard(required, 'Sin deudas vencidas.'));
  wrap.appendChild(el(`<div class="section-title">Pagos pendientes — pedidos aún dentro de plazo</div>`));
  wrap.appendChild(sectionCard(notDue, 'Sin deudas pendientes.'));
  if(oldSettled.length){
    wrap.appendChild(el(`<div class="section-title">Historial (pagado hace más de 10 días)</div>`));
    const histCard = document.createElement('div'); histCard.className='card';
    const shown = oldSettled.slice(0, historyPageSize);
    shown.forEach(p=> histCard.appendChild(renderPairRow(p)));
    if(oldSettled.length > historyPageSize){
      const more = el(`<button class="ghost" type="button">Mostrar más (${oldSettled.length-historyPageSize} restantes)</button>`);
      more.onclick = ()=>{ historyPageSize += 10; render(); };
      histCard.appendChild(more);
    }
    wrap.appendChild(histCard);
  }
  return wrap;
}
function sectionCard(list, emptyMsg){
  const card = document.createElement('div'); card.className='card';
  if(!list.length){ card.appendChild(el(`<p class="muted">${emptyMsg}</p>`)); return card; }
  list.sort((a,b)=>b.amount-a.amount).forEach(p=> card.appendChild(renderPairRow(p)));
  return card;
}
function renderPairRow(pair){
  const row = document.createElement('div'); row.className = 'debt ' + (pair.settled?'paid':'pend');
  const isOpenRow = openNetKeys.has(pair.key);
  row.innerHTML = `
    <div class="debt-head" data-toggle>
      <div>
        <div class="who"><span class="chev ${isOpenRow?'open':''}" style="display:inline-block;margin-right:4px">▾</span>${escapeHtml(userName(pair.from))} → ${escapeHtml(userName(pair.to))}</div>
        <span class="status-pill ${pair.settled?'paid':'pend'}">${pair.settled?'Pagado':'Pendiente'}</span>
      </div>
      <div style="text-align:right"><div class="amt">${fmt(pair.amount)}</div></div>
    </div>
    <div data-detail style="display:${isOpenRow?'block':'none'}"></div>
  `;
  row.querySelector('[data-toggle]').onclick = ()=>{ openNetKeys.has(pair.key)?openNetKeys.delete(pair.key):openNetKeys.add(pair.key); render(); };
  if(isOpenRow) fillPairDetail(row.querySelector('[data-detail]'), pair);
  return row;
}
function fillPairDetail(container, pair){
  const bulkRow = document.createElement('div'); bulkRow.className='actions'; bulkRow.style.justifyContent='flex-start'; bulkRow.style.marginTop='8px';
  const toUser = userById(pair.to);
  if(!pair.settled){
    if(toUser && toUser.phone){
      const b = el(`<button class="btn-sm btn-bizum" type="button">Bizum (todo)</button>`);
      b.onclick = ()=>{ const text = `Bizum a ${toUser.name} (${toUser.phone}): ${fmt(pair.amount)} — Compra Conjunta`; navigator.clipboard&&navigator.clipboard.writeText(text).catch(()=>{}); toast('Resumen copiado: '+text); };
      bulkRow.appendChild(b);
    }
    const markBtn = el(`<button class="btn-sm btn-paid" type="button">Marcar todo pagado</button>`);
    markBtn.onclick = ()=> toggleBulkForm(container, pair);
    bulkRow.appendChild(markBtn);
  }
  const csvBtn = el(`<button class="btn-sm" type="button">Exportar movimientos</button>`);
  csvBtn.onclick = ()=> exportPairStatement(pair);
  bulkRow.appendChild(csvBtn);
  container.appendChild(bulkRow);

  const list = document.createElement('div'); list.style.marginTop='8px';
  pair.txs.slice().sort((a,b)=>b.orderId.localeCompare(a.orderId)).forEach(tx=> list.appendChild(renderTxRow(tx)));
  container.appendChild(list);
}
function toggleBulkForm(container, pair){
  if(container.querySelector('.mark-form')){ container.querySelector('.mark-form').remove(); return; }
  const today = new Date().toISOString().slice(0,10);
  const form = el(`<div class="mark-form">
    <label>¿Quién lo marca como pagado?</label>
    <input type="text" data-who placeholder="Tu nombre">
    <label>Fecha de pago</label>
    <input type="date" data-date value="${today}">
    <button class="primary" data-confirm type="button" style="margin-top:8px">Confirmar</button>
  </div>`);
  form.querySelector('[data-confirm]').onclick = ()=>{
    const who = form.querySelector('[data-who]').value.trim();
    const dateVal = form.querySelector('[data-date]').value;
    if(!who) return toast('Indica quién lo marca como pagado');
    const ms = dateVal ? new Date(dateVal+'T12:00:00').getTime() : Date.now();
    pair.txs.filter(tx=>!tx.paid).forEach(tx=> saveOrderPayment(tx.orderId, tx.from, {paid:true, amount:tx.amount, marked_by:who, marked_date:ms}));
  };
  container.appendChild(form);
}
function renderTxRow(tx){
  const order = state.orders.find(o=>o.id===tx.orderId);
  const key = tx.orderId+'::'+tx.from;
  const isOpenSub = openSubOrders.has(key);
  const row = el(`<div class="sub-order">
    <div class="sub-order-head" data-toggle>
      <div>
        <div style="font-size:13px"><span class="chev ${isOpenSub?'open':''}" style="display:inline-block;margin-right:4px;font-size:11px">▾</span>${escapeHtml(order?order.supplier:'Pedido')} · ${fmtDate(order?order.createdAt:null)}</div>
        <div class="muted">${escapeHtml(userName(tx.from))} → ${escapeHtml(userName(tx.to))}${tx.paid?` · Marcado por ${escapeHtml(tx.markedBy||'—')} · ${fmtDate(tx.markedDate)}`:''}</div>
      </div>
      <div style="text-align:right">
        <div style="font-weight:700;font-family:'Space Grotesk',sans-serif">${fmt(tx.amount)}</div>
        <span class="status-pill ${tx.paid?'paid':'pend'}">${tx.paid?'Pagado':'Pendiente'}</span>
      </div>
    </div>
    <div data-sub-detail style="display:${isOpenSub?'block':'none'}"></div>
  </div>`);
  row.querySelector('[data-toggle]').onclick = ()=>{ openSubOrders.has(key)?openSubOrders.delete(key):openSubOrders.add(key); render(); };
  if(isOpenSub){
    const detail = row.querySelector('[data-sub-detail]');
    const items = document.createElement('div'); items.className='sub-items';
    if(order){
      (order.products||[]).forEach(prod=>{
        const n = Number((order.qty[tx.from]||{})[prod.id])||0;
        if(n>0) items.appendChild(el(`<div class="l"><span>${escapeHtml(prod.name)} × ${n}</span><span>${fmt(n*prod.price)}</span></div>`));
      });
    }
    const actions = document.createElement('div'); actions.className='actions'; actions.style.justifyContent='flex-start'; actions.style.marginTop='8px';
    const toUser = userById(tx.to);
    if(!tx.paid){
      if(toUser && toUser.phone){
        const b = el(`<button class="btn-sm btn-bizum" type="button">Bizum</button>`);
        b.onclick = ()=>{ const text = `Bizum a ${toUser.name} (${toUser.phone}): ${fmt(tx.amount)} — Compra Conjunta`; navigator.clipboard&&navigator.clipboard.writeText(text).catch(()=>{}); toast('Resumen copiado: '+text); };
        actions.appendChild(b);
      }
      const markBtn = el(`<button class="btn-sm btn-paid" type="button">Marcar pagado</button>`);
      markBtn.onclick = ()=> toggleTxForm(detail, tx);
      actions.appendChild(markBtn);
    } else {
      const undo = el(`<button class="btn-sm" type="button">Marcar pendiente</button>`);
      undo.onclick = ()=> saveOrderPayment(tx.orderId, tx.from, {paid:false, amount:tx.amount, marked_by:null, marked_date:null});
      actions.appendChild(undo);
    }
    detail.appendChild(items); detail.appendChild(actions);
  }
  return row;
}
function toggleTxForm(container, tx){
  if(container.querySelector('.mark-form')){ container.querySelector('.mark-form').remove(); return; }
  const today = new Date().toISOString().slice(0,10);
  const form = el(`<div class="mark-form">
    <label>¿Quién lo marca como pagado?</label>
    <input type="text" data-who placeholder="Tu nombre">
    <label>Fecha de pago</label>
    <input type="date" data-date value="${today}">
    <button class="primary" data-confirm type="button" style="margin-top:8px">Confirmar</button>
  </div>`);
  form.querySelector('[data-confirm]').onclick = ()=>{
    const who = form.querySelector('[data-who]').value.trim();
    const dateVal = form.querySelector('[data-date]').value;
    if(!who) return toast('Indica quién lo marca como pagado');
    const ms = dateVal ? new Date(dateVal+'T12:00:00').getTime() : Date.now();
    saveOrderPayment(tx.orderId, tx.from, {paid:true, amount:tx.amount, marked_by:who, marked_date:ms});
  };
  container.appendChild(form);
}
function exportPairStatement(pair){
  const rows = [['Pedido','Fecha pedido','De','A','Importe','Estado','Marcado por','Fecha de pago']];
  pair.txs.forEach(tx=>{
    const order = state.orders.find(o=>o.id===tx.orderId);
    rows.push([order?order.supplier:'', fmtDate(order?order.createdAt:null), userName(tx.from), userName(tx.to), tx.amount.toFixed(2), tx.paid?'Pagado':'Pendiente', tx.markedBy||'', tx.markedDate?fmtDate(tx.markedDate):'']);
  });
  rows.push([]); rows.push(['Neto actual', '', userName(pair.from), userName(pair.to), pair.amount.toFixed(2), pair.settled?'Pagado':'Pendiente']);
  const csv = '\uFEFF' + rows.map(r=>r.map(v=>{ const s=String(v??''); return /[",\n;]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(';')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download = `movimientos-${userName(pair.from)}-${userName(pair.to)}.csv`.toLowerCase().replace(/\s+/g,'-');
  document.body.appendChild(a); a.click(); a.remove();
}

// ---------- Usuarios ----------
function renderUsuarios(){
  const wrap = document.createElement('div');
  const listCard = el(`<div class="card"><h2>Personas del grupo</h2><p class="muted">Añade aquí a cada persona una vez, con su teléfono para Bizum.</p><div data-list></div></div>`);
  const listEl = listCard.querySelector('[data-list]');
  if(!state.users.length) listEl.appendChild(el(`<p class="muted">Todavía no hay nadie añadido.</p>`));
  state.users.forEach(u=>{
    const row = el(`<div class="user-row">
      <div class="info"><b>${escapeHtml(u.name)}</b><span>${escapeHtml(u.phone||'sin teléfono')}</span></div>
      <div class="actions"><button class="btn-sm" data-edit type="button">Editar</button><button class="btn-sm" data-del type="button">Eliminar</button></div>
    </div>`);
    row.querySelector('[data-del]').onclick = ()=>{ if(confirm('¿Eliminar a '+u.name+'?')) deleteUser(u.id); };
    row.querySelector('[data-edit]').onclick = ()=> openUserForm(u);
    listEl.appendChild(row);
  });
  wrap.appendChild(listCard);
  wrap.appendChild(renderUserForm());
  return wrap;
}
let editingUser = null;
function openUserForm(u){ editingUser = u; view='usuarios'; render(); }
function renderUserForm(){
  const u = editingUser || {};
  const card = el(`<div class="card">
    <h2>${editingUser?'Editar persona':'Añadir persona'}</h2>
    <label>Nombre</label><input type="text" id="u-name" value="${escapeAttr(u.name||'')}">
    <label>Teléfono (para Bizum)</label><input type="tel" id="u-phone" value="${escapeAttr(u.phone||'')}">
    <button class="primary" id="u-save" type="button">${editingUser?'Guardar cambios':'Añadir'}</button>
    ${editingUser?`<button class="ghost" id="u-cancel" type="button" style="margin-top:8px">Cancelar</button>`:''}
  </div>`);
  const cancelBtn = card.querySelector('#u-cancel');
  if(cancelBtn) cancelBtn.onclick = ()=>{ editingUser=null; render(); };
  card.querySelector('#u-save').onclick = ()=>{
    const name = card.querySelector('#u-name').value.trim();
    const phone = card.querySelector('#u-phone').value.trim();
    if(!name) return toast('Falta el nombre');
    saveUser({ id: editingUser?editingUser.id:uid(), name, phone });
    editingUser = null; render();
  };
  return card;
}

// ---------- Export per pedido ----------
function exportOrder(order, orientation, format){
  const {perPerson} = computeOrderTotals(order);
  const products = order.products||[], people = order.people||[];
  let aoa;
  if(orientation==='rows'){
    aoa = [['Producto', ...people.map(p=>userName(p)), 'Precio unidad', 'Total unidades']];
    products.forEach(prod=>{
      const row=[prod.name]; let totalUnits=0;
      people.forEach(p=>{ const n=Number((order.qty[p]||{})[prod.id])||0; totalUnits+=n; row.push(n); });
      row.push(prod.price.toFixed(2)); row.push(totalUnits); aoa.push(row);
    });
    aoa.push(['TOTAL A PAGAR', ...people.map(p=>perPerson[p].total.toFixed(2)), '', '']);
  } else {
    aoa = [['Persona', ...products.map(p=>p.name), 'Transporte', 'Total a pagar']];
    people.forEach(p=>{
      const row=[userName(p)];
      products.forEach(prod=> row.push(Number((order.qty[p]||{})[prod.id])||0));
      row.push(perPerson[p].transport.toFixed(2)); row.push(perPerson[p].total.toFixed(2)); aoa.push(row);
    });
  }
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const filename = 'pedido-'+(order.supplier||'proveedor').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'-'+new Date().toISOString().slice(0,10);
  if(format==='csv'){
    const csv = '\uFEFF' + XLSX.utils.sheet_to_csv(ws, {FS:';'});
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
  } else {
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Pedido'); XLSX.writeFile(wb, filename+'.xlsx');
  }
}

initAuth();
