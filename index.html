<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compra Conjunta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F4; --panel:#FFFFFF; --ink:#1F2A22; --sub:#5B6B60;
  --line:#E4E0D4; --brand:#2F6F4E; --brand-ink:#EAF3EC;
  --amber:#B5761A; --amber-bg:#FBF0DF; --owe:#A24B3B; --owe-bg:#FBEAE5;
  --paid:#2F6F4E; --paid-bg:#E7F1EA; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#171B18; --panel:#1F2521; --ink:#EDEFEA; --sub:#9AA79E;
    --line:#2C332D; --brand:#63B98A; --brand-ink:#12241A;
    --amber:#E3A94E; --amber-bg:#2E2617; --owe:#E0806D; --owe-bg:#301C18;
    --paid:#63B98A; --paid-bg:#16281F;
  }
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.45;}
h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif;}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 96px;}
header.top{position:sticky;top:0;background:var(--bg);z-index:10;padding:18px 16px 10px;border-bottom:1px solid var(--line);}
header.top .wrap{padding:0;display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.brand{font-size:19px;font-weight:700;letter-spacing:-0.01em;}
.brand span{color:var(--brand);}
.status{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
.status.ok{background:var(--paid-bg);color:var(--paid);}
.status.bad{background:var(--owe-bg);color:var(--owe);}
nav.tabs{display:flex;gap:6px;margin-top:14px;}
nav.tabs button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--sub);padding:9px 6px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;}
nav.tabs button.active{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);}
main{padding-top:16px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.card h2{margin:0 0 4px;font-size:16px;}
.muted{color:var(--sub);font-size:13px;}
.empty{text-align:center;padding:40px 20px;color:var(--sub);}
.empty h3{color:var(--ink);margin-bottom:6px;}
label{display:block;font-size:12.5px;color:var(--sub);margin:10px 0 4px;font-weight:600;}
input[type=text],input[type=tel],input[type=number]{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:15px;}
input:focus{outline:2px solid var(--brand);outline-offset:1px;}
.row{display:flex;gap:8px;}
.row>*{flex:1;}
button.primary{background:var(--brand);color:var(--brand-ink);border:none;padding:11px 16px;border-radius:10px;font-weight:700;font-size:14.5px;cursor:pointer;width:100%;margin-top:14px;}
button.ghost{background:transparent;border:1px dashed var(--line);color:var(--sub);padding:9px 12px;border-radius:9px;font-size:13.5px;cursor:pointer;width:100%;}
.chip{display:inline-block;background:var(--brand-ink);color:var(--brand);border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:700;}
.prod-row{display:grid;grid-template-columns:1fr 84px 26px;gap:6px;align-items:center;margin-bottom:6px;}
.x{border:none;background:none;color:var(--sub);font-size:18px;cursor:pointer;line-height:1;}
table.matrix{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
table.matrix th,table.matrix td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);}
table.matrix th{color:var(--sub);font-weight:600;font-size:11.5px;}
table.matrix td:first-child,table.matrix th:first-child{text-align:left;}
table.matrix input{width:52px;padding:5px;text-align:center;font-size:13.5px;}
.mtable-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.totals{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;}
.totals .line{display:flex;justify-content:space-between;padding:3px 0;font-size:13.5px;}
.totals .line b{font-family:'Space Grotesk',sans-serif;}
.order-card .meta{display:flex;justify-content:space-between;align-items:flex-start;}
.debt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.debt:last-child{border-bottom:none;}
.debt .who{font-size:14px;}
.debt .amt{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;}
.debt.paid .amt{color:var(--paid);}
.debt.pend .amt{color:var(--owe);}
.actions{display:flex;gap:6px;}
.btn-sm{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink);}
.btn-bizum{background:var(--amber-bg);color:var(--amber);border-color:transparent;}
.btn-paid{background:var(--paid-bg);color:var(--paid);border-color:transparent;}
.status-pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;}
.status-pill.pend{background:var(--owe-bg);color:var(--owe);}
.status-pill.paid{background:var(--paid-bg);color:var(--paid);}
.addp-row{display:flex;gap:6px;margin-top:8px;}
.addp-row input{flex:1;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:30px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;}
.toast.show{opacity:1;}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
#login-screen .card{max-width:340px;width:100%;}
#login-screen .brand{text-align:center;margin-bottom:4px;font-size:21px;}
#login-screen p.muted{text-align:center;margin-bottom:4px;}
#login-error{color:var(--owe);font-size:13px;margin-top:8px;min-height:16px;}
.btn-logout{background:none;border:none;color:var(--sub);font-size:12px;cursor:pointer;text-decoration:underline;padding:0;}
</style>
</head>
<body>
<div id="login-screen" style="display:none">
  <div class="card">
    <h2 class="brand">Compra <span>Conjunta</span></h2>
    <p class="muted">Accede con el usuario compartido del grupo.</p>
    <label>Correo</label>
    <input type="text" id="login-email" autocomplete="username">
    <label>Contraseña</label>
    <input type="text" id="login-password" autocomplete="current-password">
    <div id="login-error"></div>
    <button class="primary" id="login-btn" type="button">Entrar</button>
  </div>
</div>

<div id="app-root" style="display:none">
<header class="top"><div class="wrap">
  <div class="brand">Compra <span>Conjunta</span></div>
  <div style="display:flex;align-items:center;gap:8px">
    <span class="status" id="conn-status">Conectando…</span>
    <button class="btn-sm" id="btn-export" type="button">Exportar CSV</button>
  </div>
</div>
<div class="wrap" style="display:flex;justify-content:space-between;align-items:center">
<nav class="tabs" style="flex:1">
  <button id="tab-pedidos" class="active">Pedidos</button>
  <button id="tab-nuevo">Nuevo pedido</button>
  <button id="tab-balances">Balances</button>
</nav>
</div>
<div class="wrap" style="padding-top:8px;text-align:right"><button class="btn-logout" id="btn-logout" type="button">Cerrar sesión</button></div>
</header>
<div class="wrap"><main id="main"></main></div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';

let supabase = null;
let state = { orders: [], payments: {} };
let view = "pedidos";

const toast = (msg) => {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
};
const setStatus = (ok, msg) => {
  const el = document.getElementById('conn-status');
  el.textContent = msg; el.className = 'status ' + (ok ? 'ok' : 'bad');
};

const fmt = (n) => (Math.round(n*100)/100).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const uid = () => Math.random().toString(36).slice(2,10);

// ---------- persistence (Supabase) ----------
function rowToOrder(r){
  return { id:r.id, supplier:r.supplier, ownerName:r.owner_name, ownerPhone:r.owner_phone,
    transport:r.transport, products:r.products||[], people:r.people||[], qty:r.qty||{}, createdAt:r.created_at };
}
function orderToRow(o){
  return { id:o.id, supplier:o.supplier, owner_name:o.ownerName, owner_phone:o.ownerPhone,
    transport:o.transport, products:o.products, people:o.people, qty:o.qty, created_at:o.createdAt };
}

async function initAuth(){
  if(SUPABASE_URL.startsWith('YOUR_') || SUPABASE_ANON_KEY.startsWith('YOUR_')){
    document.getElementById('login-screen').style.display='flex';
    document.getElementById('login-error').textContent = 'Falta configurar config.js con tu proyecto de Supabase.';
    return;
  }
  supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data: { session } } = await supabase.auth.getSession();
  if(session){
    showApp();
  } else {
    document.getElementById('login-screen').style.display='flex';
  }
  supabase.auth.onAuthStateChange((event, session)=>{
    if(event === 'SIGNED_IN') showApp();
    if(event === 'SIGNED_OUT'){
      document.getElementById('app-root').style.display='none';
      document.getElementById('login-screen').style.display='flex';
    }
  });
}

document.getElementById('login-btn').onclick = async ()=>{
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Introduce correo y contraseña.'; return; }
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if(error){ errEl.textContent = 'Acceso incorrecto. Revisa el correo y la contraseña.'; }
};
document.getElementById('btn-logout').onclick = ()=> supabase.auth.signOut();

async function showApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-root').style.display='block';
  await loadAll();
  supabase.channel('orders-sync')
    .on('postgres_changes', {event:'*', schema:'public', table:'orders'}, loadAll)
    .subscribe();
  supabase.channel('payments-sync')
    .on('postgres_changes', {event:'*', schema:'public', table:'payments'}, loadAll)
    .subscribe();
  setStatus(true, 'Sincronizado');
}
async function loadAll(){
  const { data: orderRows, error: e1 } = await supabase.from('orders').select('*').order('created_at', {ascending:false});
  const { data: paymentRows, error: e2 } = await supabase.from('payments').select('*');
  if(e1 || e2){ setStatus(false, 'Error de conexión'); return; }
  state.orders = (orderRows||[]).map(rowToOrder);
  state.payments = {};
  (paymentRows||[]).forEach(p=>{ state.payments[p.key] = !!p.paid; });
  setStatus(true, 'Sincronizado');
  render();
}
async function saveOrder(order){
  if(!supabase) return toast('No se pudo guardar: revisa config.js');
  const { error } = await supabase.from('orders').upsert(orderToRow(order));
  if(error) toast('Error al guardar: '+error.message);
}
async function deleteOrder(id){
  if(!supabase) return;
  const { error } = await supabase.from('orders').delete().eq('id', id);
  if(error) toast('Error al eliminar: '+error.message);
}
async function setPaid(key, paid){
  if(!supabase) return toast('No se pudo guardar: revisa config.js');
  const { error } = await supabase.from('payments').upsert({ key, paid });
  if(error) toast('Error al guardar: '+error.message);
}

// ---------- calculation ----------
function computeOrderTotals(order){
  const people = order.people || [];
  const products = order.products || [];
  const qty = order.qty || {};
  const perPerson = {};
  let orderSubtotal = 0;
  people.forEach(p=>{
    let sub = 0;
    products.forEach(prod=>{
      const n = Number((qty[p]||{})[prod.id]) || 0;
      sub += n * prod.price;
    });
    perPerson[p] = { subtotal: sub };
    orderSubtotal += sub;
  });
  const transport = Number(order.transport)||0;
  people.forEach(p=>{
    const share = orderSubtotal>0 ? (perPerson[p].subtotal/orderSubtotal)*transport : 0;
    perPerson[p].transport = share;
    perPerson[p].total = perPerson[p].subtotal + share;
  });
  return { perPerson, orderSubtotal, transport };
}

function computeNetDebts(){
  const ledger = {};
  const add = (from,to,amt)=>{
    if(from===to || amt<=0.004) return;
    ledger[from] = ledger[from]||{};
    ledger[from][to] = (ledger[from][to]||0) + amt;
  };
  state.orders.forEach(order=>{
    const {perPerson} = computeOrderTotals(order);
    const owner = order.ownerName;
    (order.people||[]).forEach(p=>{
      if(p===owner) return;
      add(p, owner, perPerson[p].total);
    });
  });
  const pairs = new Set();
  Object.keys(ledger).forEach(a=>Object.keys(ledger[a]).forEach(b=>{
    pairs.add([a,b].sort().join('||'));
  }));
  const nets = [];
  pairs.forEach(key=>{
    const [a,b] = key.split('||');
    const ab = (ledger[a]&&ledger[a][b])||0;
    const ba = (ledger[b]&&ledger[b][a])||0;
    const diff = ab-ba;
    if(Math.abs(diff) < 0.005) return;
    const from = diff>0 ? a : b;
    const to = diff>0 ? b : a;
    nets.push({ from, to, amount: Math.abs(diff), key: from+'→'+to });
  });
  nets.sort((x,y)=> y.amount-x.amount);
  return nets;
}

// ---------- rendering ----------
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

function getKnownPeople(){
  const set = new Set();
  state.orders.forEach(o=>{
    if(o.ownerName) set.add(o.ownerName);
    (o.people||[]).forEach(p=>set.add(p));
  });
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'es'));
}
function drawPeopleDatalist(){
  let dl = document.getElementById('known-people');
  if(!dl){
    dl = document.createElement('datalist');
    dl.id = 'known-people';
    document.body.appendChild(dl);
  }
  dl.innerHTML = getKnownPeople().map(p=>`<option value="${escapeAttr(p)}">`).join('');
}

function render(){
  ['pedidos','nuevo','balances'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active', t===view);
  });
  drawPeopleDatalist();
  const main = document.getElementById('main');
  main.innerHTML = '';
  if(view==='pedidos') main.appendChild(renderPedidos());
  if(view==='nuevo') main.appendChild(renderNuevo());
  if(view==='balances') main.appendChild(renderBalances());
}

function renderPedidos(){
  const wrap = document.createElement('div');
  if(!state.orders.length){
    wrap.appendChild(el(`<div class="card empty"><h3>Todavía no hay pedidos</h3><p class="muted">Crea el primer pedido a un proveedor desde la pestaña "Nuevo pedido".</p></div>`));
    return wrap;
  }
  state.orders.forEach(order=>{
    const {perPerson, orderSubtotal, transport} = computeOrderTotals(order);
    const card = el(`<div class="card order-card">
      <div class="meta">
        <div>
          <span class="chip">${escapeHtml(order.supplier||'Proveedor')}</span>
          <h2 style="margin-top:8px">${escapeHtml(order.supplier||'')}</h2>
          <p class="muted">Organiza ${escapeHtml(order.ownerName||'—')} · ${escapeHtml(order.ownerPhone||'sin teléfono')}</p>
        </div>
      </div>
      <div class="mtable-wrap"></div>
      <div class="addp-row">
        <input type="text" placeholder="Añadir persona" list="known-people" data-add-person="${order.id}">
        <button class="btn-sm" data-add-person-btn="${order.id}">Añadir</button>
      </div>
      <div class="totals" data-totals></div>
      <div class="row" style="margin-top:12px">
        <button class="btn-sm" data-del="${order.id}">Eliminar pedido</button>
      </div>
    </div>`);
    card.querySelector('.mtable-wrap').appendChild(renderMatrix(order));
    const totalsEl = card.querySelector('[data-totals]');
    (order.people||[]).forEach(p=>{
      totalsEl.appendChild(el(`<div class="line"><span>${escapeHtml(p)}${p===order.ownerName?' <span class="muted">(cobra)</span>':''}</span><b>${fmt(perPerson[p].total)}</b></div>`));
    });
    totalsEl.appendChild(el(`<div class="line muted"><span>Subtotal productos</span><span>${fmt(orderSubtotal)}</span></div>`));
    totalsEl.appendChild(el(`<div class="line muted"><span>Transporte</span><span>${fmt(transport)}</span></div>`));
    card.querySelector('[data-del]').onclick = ()=>{ if(confirm('¿Eliminar este pedido?')) deleteOrder(order.id); };
    const addBtn = card.querySelector('[data-add-person-btn]');
    addBtn.onclick = ()=>{
      const input = card.querySelector('[data-add-person]');
      const name = input.value.trim();
      if(!name) return;
      const people = order.people||[];
      if(people.includes(name)) return toast('Esa persona ya está en la tabla');
      const next = {...order, people:[...people, name]};
      saveOrder(next); input.value='';
    };
    wrap.appendChild(card);
  });
  return wrap;
}

function renderMatrix(order){
  const products = order.products||[];
  const people = order.people||[];
  const qty = order.qty||{};
  const t = document.createElement('table');
  t.className = 'matrix';
  let head = '<tr><th>Persona</th>' + products.map(p=>`<th>${escapeHtml(p.name)}<br><span style="font-weight:400">${fmt(p.price)}</span></th>`).join('') + '</tr>';
  t.innerHTML = head;
  people.forEach(person=>{
    const tr = document.createElement('tr');
    let cells = `<td>${escapeHtml(person)}</td>`;
    products.forEach(prod=>{
      const val = (qty[person]||{})[prod.id] || '';
      cells += `<td><input type="number" min="0" step="1" value="${val}" data-qty-order="${order.id}" data-qty-person="${escapeAttr(person)}" data-qty-prod="${prod.id}"></td>`;
    });
    tr.innerHTML = cells;
    t.appendChild(tr);
  });
  t.querySelectorAll('input[data-qty-order]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const oid = inp.dataset.qtyOrder, person = inp.dataset.qtyPerson, pid = inp.dataset.qtyProd;
      const cur = state.orders.find(o=>o.id===oid);
      if(!cur) return;
      const nextQty = JSON.parse(JSON.stringify(cur.qty||{}));
      nextQty[person] = nextQty[person]||{};
      nextQty[person][pid] = Number(inp.value)||0;
      saveOrder({...cur, qty: nextQty});
    });
  });
  return t;
}

let draftProducts = [{id:uid(), name:'', price:''}];
function renderNuevo(){
  const wrap = el(`<div class="card">
    <h2>Nuevo pedido</h2>
    <p class="muted">Rellena los datos del proveedor y quién lo organiza.</p>
    <label>Proveedor</label>
    <input type="text" id="f-supplier" placeholder="Ej. Cooperativa Ecológica">
    <div class="row">
      <div><label>Persona que organiza</label><input type="text" id="f-owner" list="known-people" placeholder="Nombre"></div>
      <div><label>Teléfono (Bizum)</label><input type="tel" id="f-phone" placeholder="600 000 000"></div>
    </div>
    <label>Coste de transporte total</label>
    <input type="number" id="f-transport" min="0" step="0.01" placeholder="0,00">
    <label>Productos</label>
    <div id="f-products"></div>
    <button class="ghost" id="f-addprod" type="button">+ Añadir producto</button>
    <button class="primary" id="f-create" type="button">Crear pedido</button>
  </div>`);
  const prodWrap = wrap.querySelector('#f-products');
  function drawProducts(){
    prodWrap.innerHTML='';
    draftProducts.forEach((p,i)=>{
      const row = el(`<div class="prod-row">
        <input type="text" placeholder="Nombre del producto" value="${escapeAttr(p.name)}" data-p="${i}" data-f="name">
        <input type="number" placeholder="Precio €" min="0" step="0.01" value="${p.price}" data-p="${i}" data-f="price">
        <button class="x" data-rm="${i}" type="button">✕</button>
      </div>`);
      row.querySelectorAll('input').forEach(inp=>{
        inp.oninput = ()=>{ draftProducts[inp.dataset.p][inp.dataset.f] = inp.value; };
      });
      row.querySelector('[data-rm]').onclick = ()=>{ draftProducts.splice(i,1); if(!draftProducts.length) draftProducts=[{id:uid(),name:'',price:''}]; drawProducts(); };
      prodWrap.appendChild(row);
    });
  }
  drawProducts();
  wrap.querySelector('#f-addprod').onclick = ()=>{ draftProducts.push({id:uid(),name:'',price:''}); drawProducts(); };
  wrap.querySelector('#f-create').onclick = ()=>{
    const supplier = wrap.querySelector('#f-supplier').value.trim();
    const owner = wrap.querySelector('#f-owner').value.trim();
    const phone = wrap.querySelector('#f-phone').value.trim();
    const transport = Number(wrap.querySelector('#f-transport').value)||0;
    const products = draftProducts.filter(p=>p.name.trim() && Number(p.price)>0)
      .map(p=>({id:p.id, name:p.name.trim(), price:Number(p.price)}));
    if(!supplier || !owner || !products.length){
      return toast('Falta proveedor, organizador o algún producto válido');
    }
    const order = {
      id: uid(), supplier, ownerName: owner, ownerPhone: phone,
      transport, products, people:[owner], qty:{}, createdAt: Date.now()
    };
    saveOrder(order);
    draftProducts = [{id:uid(),name:'',price:''}];
    view='pedidos'; render();
    toast('Pedido creado');
  };
  return wrap;
}

function renderBalances(){
  const nets = computeNetDebts();
  const wrap = document.createElement('div');
  if(!nets.length){
    wrap.appendChild(el(`<div class="card empty"><h3>Nada pendiente</h3><p class="muted">En cuanto haya pedidos con cantidades, aquí aparecerán las deudas netas entre personas.</p></div>`));
    return wrap;
  }
  const card = el(`<div class="card"><h2>Balances netos</h2><p class="muted">Deudas ya compensadas entre todos los pedidos.</p></div>`);
  nets.forEach(n=>{
    const key = n.key;
    const paid = !!state.payments[key];
    const row = el(`<div class="debt ${paid?'paid':'pend'}">
      <div>
        <div class="who">${escapeHtml(n.from)} → ${escapeHtml(n.to)}</div>
        <span class="status-pill ${paid?'paid':'pend'}">${paid?'Pagado':'Pendiente'}</span>
      </div>
      <div style="text-align:right">
        <div class="amt">${fmt(n.amount)}</div>
        <div class="actions" style="margin-top:6px">
          ${!paid ? `<button class="btn-sm btn-bizum" data-bizum="${key}">Bizum</button>` : ''}
          <button class="btn-sm ${paid?'':'btn-paid'}" data-toggle="${key}">${paid?'Marcar pendiente':'Marcar pagado'}</button>
        </div>
      </div>
    </div>`);
    row.querySelector('[data-toggle]').onclick = ()=> setPaid(key, !paid);
    const bizumBtn = row.querySelector('[data-bizum]');
    if(bizumBtn){
      bizumBtn.onclick = ()=>{
        const owner = state.orders.find(o=>o.ownerName===n.to);
        const phone = owner ? owner.ownerPhone : '';
        const text = `Bizum a ${n.to}${phone?` (${phone})`:''}: ${fmt(n.amount)} — Compra Conjunta`;
        navigator.clipboard && navigator.clipboard.writeText(text).catch(()=>{});
        toast('Resumen copiado: '+text);
      };
    }
    card.appendChild(row);
  });
  wrap.appendChild(card);
  return wrap;
}

function csvEscape(v){
  const s = String(v??'');
  return /[",\n;]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function buildCSV(){
  const rows = [];
  rows.push(['PEDIDOS']);
  rows.push(['Proveedor','Organizador','Teléfono','Persona','Producto','Cantidad','Precio unidad','Importe producto','Transporte prorrateado','Total a pagar']);
  state.orders.forEach(order=>{
    const {perPerson} = computeOrderTotals(order);
    (order.people||[]).forEach(person=>{
      const items = (order.products||[]).filter(prod => Number((order.qty&&order.qty[person]&&order.qty[person][prod.id])||0) > 0);
      if(!items.length){
        rows.push([order.supplier, order.ownerName, order.ownerPhone, person, '', '', '', '', perPerson[person].transport.toFixed(2), perPerson[person].total.toFixed(2)]);
      } else {
        items.forEach((prod,i)=>{
          const n = Number(order.qty[person][prod.id])||0;
          rows.push([order.supplier, order.ownerName, order.ownerPhone, person, prod.name, n, prod.price.toFixed(2), (n*prod.price).toFixed(2),
            i===0 ? perPerson[person].transport.toFixed(2) : '', i===0 ? perPerson[person].total.toFixed(2) : '']);
        });
      }
    });
  });
  rows.push([]);
  rows.push(['BALANCES NETOS']);
  rows.push(['De','A','Importe','Estado']);
  computeNetDebts().forEach(n=>{
    const paid = !!state.payments[n.key];
    rows.push([n.from, n.to, n.amount.toFixed(2), paid?'Pagado':'Pendiente']);
  });
  return '\uFEFF' + rows.map(r=>r.map(csvEscape).join(';')).join('\n');
}
function exportCSV(){
  if(!state.orders.length) return toast('Todavía no hay pedidos que exportar');
  const csv = buildCSV();
  const filename = 'compra-conjunta-'+new Date().toISOString().slice(0,10)+'.csv';
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}
document.getElementById('btn-export').onclick = exportCSV;

function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

document.getElementById('tab-pedidos').onclick = ()=>{ view='pedidos'; render(); };
document.getElementById('tab-nuevo').onclick = ()=>{ view='nuevo'; render(); };
document.getElementById('tab-balances').onclick = ()=>{ view='balances'; render(); };

render();
initAuth();
</script>
